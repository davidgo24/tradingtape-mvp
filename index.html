<!DOCTYPE html>
<html>
<head>
  <title>TradingTape Player</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #view-session-list, #view-player {
      flex: 1;
      padding: 20px;
      display: none;
      overflow-y: auto;
    }
    .session-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f4f4f4;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .session-item span.title {
      flex-grow: 1;
      font-weight: 600;
      cursor: pointer;
    }
    .session-item span.meta {
      color: #555;
      font-size: 0.9em;
      margin-left: 8px;
    }
    .session-item button {
      background: none;
      border: none;
      font-size: 1.1em;
      cursor: pointer;
      color: #cc0000;
    }
    video {
      max-width: 100%;
      height: auto;
    }
    #obsControls button {
      margin-right: 8px;
    }
    #recordTimer {
      position: fixed;
      bottom: 10px;
      left: 10px;
      color: red;
      font-size: 1.2em;
      font-family: sans-serif;
      display: none;
    }
  </style>
</head>
<body>
  <div id="view-session-list">
    <h2>📂 Your Trading Sessions</h2>
    <div id="obsControls">
      <button id="connect">Connect to OBS</button>
      <button id="start">Start Recording</button>
      <button id="stop">Stop Recording</button>
      <button onclick="loadSessions()">🔄 Refresh Sessions</button>
      <p id="status"></p>
    </div>
    <div id="sessionList"></div>
  </div>

  <div id="view-player">
    <button onclick="switchView('view-session-list')">🔙 Back</button>
    <h2 id="sessionTitle"></h2>
    <video id="player" controls></video>
  </div>

  <div id="recordTimer">⏱ 00:00</div>

  <script src="renderer.js"></script>
</body>
</html>
